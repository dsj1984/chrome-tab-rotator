<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            margin: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
            background: #333;
        }

        .icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
        }

        canvas {
            border: 1px solid #666;
        }
    </style>
</head>

<body>
    <div class="icon"><canvas id="c16" width="16" height="16"></canvas><span>16px</span></div>
    <div class="icon"><canvas id="c32" width="32" height="32"></canvas><span>32px</span></div>
    <div class="icon"><canvas id="c48" width="48" height="48"></canvas><span>48px</span></div>
    <div class="icon"><canvas id="c128" width="128" height="128"></canvas><span>128px</span></div>

    <script>
        const sizes = [16, 32, 48, 128];
        sizes.forEach(size => {
            const canvas = document.getElementById('c' + size);
            const ctx = canvas.getContext('2d');

            // Background
            ctx.fillStyle = '#1a1a2e';
            ctx.beginPath();
            ctx.roundRect(0, 0, size, size, size * 0.125);
            ctx.fill();

            // Emoji
            ctx.font = `${size * 0.65}px "Segoe UI Emoji", "Apple Color Emoji", sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🔄', size / 2, size / 2 + size * 0.05);

            // Download link
            const link = document.createElement('a');
            link.download = `icon${size}.png`;
            link.href = canvas.toDataURL('image/png');
            link.textContent = `Download ${size}px`;
            link.style.color = '#4ade80';
            canvas.parentElement.appendChild(link);
        });
    </script>
</body>

</html>
